name: Node.js CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
            npm install
            

      - name: Test lint 
        run: npm run lint

      - name: unit test 
        run: npm test   
      - name: code coverage 
        run: npm coverage


